    --card2: #eef1f9;
    --border: #dce2f0;
    --text: #111629;
    --muted: #647091;
    --accent: #2563eb;
    --accent2: #7c3aed;
    --neon: rgba(37, 99, 235, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }
  .glass {
    background: rgba(16, 21, 38, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  html.light .glass {
    background: rgba(255, 255, 255, 0.88);
  }
  .soft { background: var(--card2); }
  .muted { color: var(--muted); }
  .line { border-color: var(--border); }
  .input {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    padding: 11px 14px;
    width: 100%;
    outline: none;
    font-size: 14px;
    transition: all 0.2s;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--neon);
  }
  .btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    border-radius: 14px;
    font-weight: 600;
    padding: 10px 16px;
    font-size: 13px;
    transition: transform 0.15s, opacity 0.15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover { opacity: 0.94; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-weight: 600;
    padding: 9px 14px;
    font-size: 13px;
    transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--accent); }
  .grad { background: linear-gradient(135deg, #1d4ed8, #3b82f6, #8b5cf6); }
  .logo-text {
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hs::-webkit-scrollbar { display: none; }
  .hs { scrollbar-width: none; }
  .mood-chip {
    font-size: 26px;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
    background: var(--card2);
    transition: all 0.15s;
  }
  .mood-chip:hover { transform: translateY(-2px); }
  .mood-chip.on {
    border-color: var(--accent);
    background: var(--neon);
    transform: scale(1.06);
  }
  #toast { transition: opacity 0.25s, transform 0.25s; }
  .call-root {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: #05070e;
    flex-direction: column;
    color: #fff;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.95); opacity: 0.7; }
    70% { transform: scale(1.25); opacity: 0; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  .pulse-ring::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 9999px;
    border: 2px solid #3b82f6;
    animation: pulseRing 1.8s infinite;
  }

const pairId = (a, b) => [a, b].sort().join('_');
const tsToMs = x => (x && x.createdAt && x.createdAt.toMillis) ? x.createdAt.toMillis() : Date.now();

function timeAgo(ms) {
  const diff = Math.max(0, Date.now() - ms);
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return lang === 'ru' ? 'только что' : 'just now';
  if (mins < 60) return `${mins}m`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h`;
  return `${Math.floor(hrs / 24)}d`;
}

function showToast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, 0)';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%, 10px)';
  }, 3000);
}

function avatarHTML(u, size = 'w-11 h-11', textSize = 'text-base') {
  if (u && u.photo) {
    return `<img src="${esc(u.photo)}" alt="" class="${size} rounded-full object-cover shrink-0 border border-white/10">`;
  }
  const name = (u && (u.firstName || u.name)) || '?';
  const seed = [...((u && u.id) || name)].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  return `<div class="${size} ${textSize} rounded-full flex items-center justify-center font-bold text-white shrink-0 shadow-inner" style="background:linear-gradient(135deg, hsl(${seed},70%,48%), hsl(${(seed+45)%360},75%,42%))">${esc(name.charAt(0).toUpperCase())}</div>`;
}

function formatRichText(text) {
  let safe = esc(text);
  // Highlight #hashtags and @mentions
  safe = safe.replace(/(#[a-zA-Z0-9_а-яА-ЯёЁ]+)/g, '<span class="text-blue-400 font-medium cursor-pointer" onclick="searchTag(\'$1\')">$1</span>');
  safe = safe.replace(/(@[a-zA-Z0-9_]+)/g, '<span class="text-purple-400 font-medium">$1</span>');
  return safe;
}

function compressImageFile(file, maxDim = 800, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const getUser = uid => state.profilesCache.get(uid) || { id: uid, name: 'Moodgram User', username: 'user' };

async function ensureProfiles(uids) {
  const missing = [...new Set(uids)].filter(id => id && !state.profilesCache.has(id));
  if (!missing.length || !db) return;
  await Promise.all(missing.map(async id => {
    try {
      const doc = await db.collection('users').doc(id).get();
      if (doc.exists) state.profilesCache.set(id, { id, ...doc.data() });
    } catch (_) {}
  }));
  render();
}

async function handleRegister(e) {
  e.preventDefault();
  const firstName = $('reg-fname').value.trim();
  const lastName = $('reg-lname').value.trim();
  const username = $('reg-user').value.trim().toLowerCase().replace(/^@/, '');
  const email = $('reg-email').value.trim().toLowerCase();
  const dob = $('reg-dob').value;
  const prefLang = $('reg-lang').value;
  const pass = $('reg-pass').value;
  const confirm = $('reg-cpass').value;

  if (!firstName || !lastName || !username || !email || !dob || !pass) {
    state.error = tr('errFields'); return render();
  }
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    state.error = tr('errUsername'); return render();
  }
  if (pass.length < 6) {
    state.error = tr('errPassLen'); return render();
  }
  if (pass !== confirm) {
    state.error = tr('errPassMatch'); return render();
  }

  state.busy = true; state.error = ''; render();
  try {
    // Check username availability first
    const unameDoc = await db.collection('usernames').doc(username).get();
    if (unameDoc.exists) {
      state.busy = false; state.error = tr('errUserTaken'); return render();
    }

    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const fullName = `${firstName} ${lastName}`;

    // Atomic transaction for username uniqueness + First 30 Users Free Verification Badge
    await db.runTransaction(async tx => {
      const uRef = db.collection('usernames').doc(username);
      const promoRef = db.collection('meta').doc('badge_promo');
      const uSnap = await tx.get(uRef);
      if (uSnap.exists) throw new Error('USERNAME_TAKEN');

      const pSnap = await tx.get(promoRef);
      const allocated = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      const getsFreeBadge = allocated < APP_CONFIG.FREE_BADGE_LIMIT;

      const oneYearFromNow = firebase.firestore.Timestamp.fromDate(
        new Date(Date.now() + 365 * 24 * 60 * 60 * 1000)
      );

      // Store username mapping for username-based login & recovery (no passwords ever stored)
      tx.set(uRef, { uid, email, createdAt: TS() });

      if (getsFreeBadge) {
        tx.set(promoRef, { allocatedCount: allocated + 1 }, { merge: true });
        tx.set(db.collection('badge_allocations').doc(uid), {
          uid,
          type: 'free_first_30',
          allocatedAt: TS(),
          expiresAt: oneYearFromNow
        });
      }

      tx.set(db.collection('users').doc(uid), {
        firstName,
        lastName,
        name: fullName,
        username,
        email,
        dob,
        language: prefLang,
        bio: '',
        website: '',
        photo: '',
        isPrivate: false,
        verified: getsFreeBadge,
        badgeType: getsFreeBadge ? 'free_first_30' : 'none',
        badgeExpiresAt: getsFreeBadge ? oneYearFromNow : null,
        savedPosts: [],
        online: true,
        lastSeen: TS(),
        createdAt: TS()
      });
    });

    try { await cred.user.sendEmailVerification(); } catch (_) {}
    setLang(prefLang);
    state.busy = false;
  } catch (err) {
    state.busy = false;
    state.error = err.message === 'USERNAME_TAKEN' ? tr('errUserTaken') : (err.message || tr('errGeneric'));
    render();
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const identifier = $('log-id').value.trim().toLowerCase();
  const pass = $('log-pass').value;
  if (!identifier || !pass) { state.error = tr('errFields'); return render(); }

  state.busy = true; state.error = ''; render();
  try {
    let loginEmail = identifier;
    // Support login via @username
    if (!identifier.includes('@') || identifier.startsWith('@')) {
      const cleanUser = identifier.replace(/^@/, '');
      const mapDoc = await db.collection('usernames').doc(cleanUser).get();
      if (!mapDoc.exists || !mapDoc.data().email) {
        state.busy = false; state.error = tr('errUserNotFound'); return render();
      }
      loginEmail = mapDoc.data().email;
    }
    await auth.signInWithEmailAndPassword(loginEmail, pass);
    state.busy = false;
  } catch (err) {
    state.busy = false;
    state.error = err.message || tr('errGeneric');
    render();
  }
}

async function handleGoogleLogin() {
  state.error = '';
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  } catch (err) {
    if (err.code !== 'auth/popup-closed-by-user') {
      state.error = err.message || tr('errGeneric');
      render();
    }
  }
}

async function handleCompleteGoogleProfile(e) {
  e.preventDefault();
  const username = $('g-username').value.trim().toLowerCase().replace(/^@/, '');
  const firstName = $('g-fname').value.trim();
  const lastName = $('g-lname').value.trim();
  if (!/^[a-z0-9_]{3,20}$/.test(username)) { state.error = tr('errUsername'); return render(); }
  if (!firstName) { state.error = tr('errFields'); return render(); }

  state.busy = true; state.error = ''; render();
  try {
    const uid = state.user.uid;
    const email = state.user.email || '';
    await db.runTransaction(async tx => {
      const uRef = db.collection('usernames').doc(username);
      const promoRef = db.collection('meta').doc('badge_promo');
      const uSnap = await tx.get(uRef);
      if (uSnap.exists) throw new Error('USERNAME_TAKEN');

      const pSnap = await tx.get(promoRef);
      const allocated = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      const getsFreeBadge = allocated < APP_CONFIG.FREE_BADGE_LIMIT;
      const oneYearFromNow = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 365 * 24 * 60 * 60 * 1000));

      tx.set(uRef, { uid, email, createdAt: TS() });
      if (getsFreeBadge) {
        tx.set(promoRef, { allocatedCount: allocated + 1 }, { merge: true });
      }
      tx.set(db.collection('users').doc(uid), {
        firstName,
        lastName,
        name: `${firstName} ${lastName}`.trim(),
        username,
        email,
        language: lang,
        bio: '',
        website: '',
        photo: state.user.photoURL || '',
        isPrivate: false,
        verified: getsFreeBadge,
        badgeType: getsFreeBadge ? 'free_first_30' : 'none',
        badgeExpiresAt: getsFreeBadge ? oneYearFromNow : null,
        savedPosts: [],
        online: true,
        lastSeen: TS(),
        createdAt: TS()
      });
    });

    const fresh = await db.collection('users').doc(uid).get();
    state.profile = { id: uid, ...fresh.data() };
    state.profilesCache.set(uid, state.profile);
    state.busy = false;
    initRealtimeListeners();
    render();
  } catch (err) {
    state.busy = false;
    state.error = err.message === 'USERNAME_TAKEN' ? tr('errUserTaken') : tr('errGeneric');
    render();
  }
}

async function handleAccountRecovery(e) {
  e.preventDefault();
  const uname = $('rec-user').value.trim().toLowerCase().replace(/^@/, '');
  if (!uname) { state.error = tr('errFields'); return render(); }
  state.busy = true; state.error = ''; render();
  try {
    const doc = await db.collection('usernames').doc(uname).get();
    if (doc.exists && doc.data().email) {
      await auth.sendPasswordResetEmail(doc.data().email);
    }
    state.busy = false;
    showToast(tr('resetSent'));
    state.authMode = 'login';
    render();
  } catch (err) {
    state.busy = false;
    showToast(tr('resetSent'));
    state.authMode = 'login';
    render();
  }
}

/* ============================================================================
   6. REALTIME FIRESTORE LISTENERS
   ============================================================================ */
function addSub(unsub) { state.unsubs.push(unsub); }
function cleanupSubscriptions() {
  state.unsubs.forEach(fn => { try { fn(); } catch (_) {} });
  state.unsubs = [];
  if (state.chatUnsub) { state.chatUnsub(); state.chatUnsub = null; }
}

function initRealtimeListeners() {
  cleanupSubscriptions();
  const uid = state.user.uid;

  // 1. User profile realtime sync
  addSub(db.collection('users').doc(uid).onSnapshot(doc => {
    if (doc.exists) {
      state.profile = { id: uid, ...doc.data() };
      state.profilesCache.set(uid, state.profile);
      render();
    }
  }));

  // 2. Promo badge counter
  addSub(db.collection('meta').doc('badge_promo').onSnapshot(doc => {
    state.badgeCountUsed = doc.exists ? (doc.data().allocatedCount || 0) : 0;
    render();
  }));

  // 3. Following & Followers
  addSub(db.collection('follows').where('followerId', '==', uid).onSnapshot(snap => {
    state.followingIds = snap.docs.map(d => d.data().followingId);
    ensureProfiles(state.followingIds);
    render();
  }));

  addSub(db.collection('follows').where('followingId', '==', uid).onSnapshot(snap => {
    state.followerIds = snap.docs.map(d => d.data().followerId);
    ensureProfiles(state.followerIds);
    render();
  }));

  // 4. Blocks
  addSub(db.collection('blocks').where('blockerId', '==', uid).onSnapshot(snap => {
    state.blockedIds = snap.docs.map(d => d.data().blockedId);
    render();
  }));

  // 5. Posts Feed
  addSub(db.collection('posts').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
    state.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.posts.map(p => p.uid));
    render();
  }));

  // 6. Moods Timeline (Central Feature!)
  addSub(db.collection('moods').orderBy('createdAt', 'desc').limit(80).onSnapshot(snap => {
    state.moods = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.moods.map(m => m.uid));
    render();
  }));

  // 7. Stories (last 24 hours)
  const dayAgo = firebase.firestore.Timestamp.fromDate(new Date(Date.now() - 24 * 3600 * 1000));
  addSub(db.collection('stories').where('createdAt', '>', dayAgo).orderBy('createdAt', 'desc').onSnapshot(snap => {
    state.stories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.stories.map(s => s.uid));
    render();
  }));

  // 8. Notifications
  addSub(db.collection('notifications').doc(uid).collection('items').orderBy('createdAt', 'desc').limit(40).onSnapshot(snap => {
    state.notifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.notifs.map(n => n.fromUid));
    render();
  }));

  // 9. Discover users list for Explore
  addSub(db.collection('users').limit(30).onSnapshot(snap => {
    state.allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.allUsers.forEach(u => state.profilesCache.set(u.id, u));
    render();
  }));

  // 10. Incoming WebRTC calls
  watchIncomingCalls();
}

async function pushNotification(toUid, type, text, refId = '') {
  if (!toUid || toUid === state.user.uid) return;
  try {
    await db.collection('notifications').doc(toUid).collection('items').add({
      fromUid: state.user.uid,
      type,
      text,
      refId,
      read: false,
      createdAt: TS()
    });
  } catch (_) {}
}

   ============================================================================ */
function openMoodComposer(existingMood = null) {
  state.activeModal = 'mood';
  if (existingMood) {
    state.editingMoodId = existingMood.id;
    state.selectedMood = existingMood.emoji;
    state.moodDraft = existingMood.text;
  } else {
    state.editingMoodId = null;
    state.selectedMood = MOOD_LIST[0].emoji;
    state.moodDraft = '';
  }
  render();
}

async function saveMoodPost() {
  const text = state.moodDraft.trim();
  if (!text) return showToast(tr('errFields'));
  const moodObj = MOOD_LIST.find(m => m.emoji === state.selectedMood) || MOOD_LIST[0];

  try {
    if (state.editingMoodId) {
      await db.collection('moods').doc(state.editingMoodId).update({
        emoji: state.selectedMood,
        moodLabel: moodObj.en,
        text,
        updatedAt: TS()
      });
    } else {
      await db.collection('moods').add({
        uid: state.user.uid,
        emoji: state.selectedMood,
        moodLabel: moodObj.en,
        text,
        likes: [],
        reactions: {},
        comments: [],
        createdAt: TS()
      });
      // Update user's latest mood badge on profile
      await db.collection('users').doc(state.user.uid).update({
        latestMood: { emoji: state.selectedMood, text, updatedAt: TS() }
      });
    }
    state.activeModal = null;
    state.moodDraft = '';
    state.editingMoodId = null;
    showToast(tr('toastPosted'));
    render();
  } catch (err) {
    showToast(tr('errGeneric'));
  }
}

async function toggleMoodLike(moodId) {
  const m = state.moods.find(x => x.id === moodId);
  if (!m) return;
  const liked = (m.likes || []).includes(state.user.uid);
  await db.collection('moods').doc(moodId).update({
    likes: liked ? FV().arrayRemove(state.user.uid) : FV().arrayUnion(state.user.uid)
  });
  if (!liked) pushNotification(m.uid, 'mood_like', `liked your ${m.emoji} Mood`, moodId);
}

async function addMoodComment(moodId) {
  const input = $(`mcomm-${moodId}`);
  const text = input ? input.value.trim() : '';
  if (!text) return;
  const m = state.moods.find(x => x.id === moodId);
  await db.collection('moods').doc(moodId).update({
    comments: FV().arrayUnion({
      uid: state.user.uid,
      text,
      createdAt: Date.now()
    })
  });
  if (m) pushNotification(m.uid, 'mood_comment', `commented on your Mood: "${text}"`, moodId);
  input.value = '';
}

async function deleteMood(moodId) {
  await db.collection('moods').doc(moodId).delete();
}

  render();
}

async function publishPost() {
  const caption = state.postCaption.trim();
  const image = state.postImageData || state.postImageUrl.trim();
  const location = state.postLocation.trim();
  if (!caption && !image) return showToast(tr('errFields'));

  const hashtags = (caption.match(/#[a-zA-Z0-9_а-яА-ЯёЁ]+/g) || []).map(t => t.toLowerCase());

  try {
    await db.collection('posts').add({
      uid: state.user.uid,
      caption,
      image,
      location,
      hashtags,
      likes: [],
      comments: [],
      createdAt: TS()
    });
    state.activeModal = null;
    state.postCaption = '';
    state.postImageUrl = '';
    state.postImageData = '';
    state.postLocation = '';
    showToast(tr('toastPosted'));
    render();
  } catch (err) {
    showToast(tr('errGeneric'));
  }
}

async function sendChatMessage(e) {
  if (e) e.preventDefault();
  const text = state.draftMsg.trim();
  if (!text || !state.chatWith) return;

  const cid = pairId(state.user.uid, state.chatWith);
  const convRef = db.collection('conversations').doc(cid);

  if (state.editingMsgId) {
    await convRef.collection('messages').doc(state.editingMsgId).update({
      text,
      edited: true
    });
    state.editingMsgId = null;
    state.draftMsg = '';
    render();
    return;
  }

  const payload = {
    senderId: state.user.uid,
    receiverId: state.chatWith,
    type: 'text',
    text,
    replyTo: state.replyToMsg ? { id: state.replyToMsg.id, text: state.replyToMsg.text } : null,
    reaction: '',
    read: false,
    createdAt: TS()
  };

  state.draftMsg = '';
  state.replyToMsg = null;

  await convRef.set({
    members: [state.user.uid, state.chatWith],
    lastMessage: text,
    updatedAt: TS()
  }, { merge: true });

  await convRef.collection('messages').add(payload);
  pushNotification(state.chatWith, 'message', `sent a message: ${text.slice(0, 40)}`);
}

async function toggleVoiceRecording() {
  if (state.isRecording && state.mediaRecorder) {
    state.mediaRecorder.stop();
    state.isRecording = false;
    render();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.audioChunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = async () => {
        const cid = pairId(state.user.uid, state.chatWith);
        await db.collection('conversations').doc(cid).collection('messages').add({
          senderId: state.user.uid,
          receiverId: state.chatWith,
          type: 'audio',
          audio: reader.result,
          text: '🎤 Voice message',
          createdAt: TS()
        });
      };
      reader.readAsDataURL(blob);
    };
    mr.start();
    state.mediaRecorder = mr;
    state.isRecording = true;
    render();
  } catch (err) {
    showToast('Microphone permission required for voice messages.');
  }
}

/* ============================================================================
   10. WEBRTC AUDIO & VIDEO CALLING
   ============================================================================ */
const RTC_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ]
};
const rtcState = { id: null, pc: null, local: null, remote: null, unsubs: [], timer: null, seconds: 0 };

function startCallTimer() {
  rtcState.seconds = 0;
  clearInterval(rtcState.timer);
  rtcState.timer = setInterval(() => {
    rtcState.seconds++;
    const m = String(Math.floor(rtcState.seconds / 60)).padStart(2, '0');
    const s = String(rtcState.seconds % 60).padStart(2, '0');
    const el = $('call-timer');
    if (el) el.textContent = `${m}:${s}`;
  }, 1000);
}

async function startWebRTCCall(targetUid, callType) {
  if (rtcState.id) return;
  const peer = getUser(targetUid);
  const callRef = db.collection('calls').doc();
  rtcState.id = callRef.id;

  try {
    rtcState.local = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: callType === 'video'
    });
  } catch (err) {
    rtcState.id = null;
    return showToast('Camera/Microphone access denied.');
  }

  const pc = new RTCPeerConnection(RTC_CONFIG);
  rtcState.pc = pc;
  rtcState.remote = new MediaStream();

  rtcState.local.getTracks().forEach(t => pc.addTrack(t, rtcState.local));
  pc.ontrack = e => {
    e.streams[0].getTracks().forEach(t => rtcState.remote.addTrack(t));
    const rv = $('remote-video');
    if (rv) rv.srcObject = rtcState.remote;
  };

  pc.onicecandidate = e => {
    if (e.candidate) callRef.collection('callerCandidates').add(e.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await callRef.set({
    callerId: state.user.uid,
    calleeId: targetUid,
    type: callType,
    status: 'ringing',
    offer: { type: offer.type, sdp: offer.sdp },
    createdAt: TS()
  });

  renderCallOverlay(peer, callType, tr('calling'), false);

  rtcState.unsubs.push(callRef.onSnapshot(async snap => {
    const data = snap.data();
    if (!data) return;
    if (['ended', 'declined'].includes(data.status)) return endWebRTCCall(false);
    if (data.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      startCallTimer();
    }
  }));

  rtcState.unsubs.push(callRef.collection('calleeCandidates').onSnapshot(snap => {
    snap.docChanges().forEach(c => {
      if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  }));
}

function watchIncomingCalls() {
  addSub(db.collection('calls')
    .where('calleeId', '==', state.user.uid)
    .where('status', '==', 'ringing')
    .onSnapshot(snap => {
      snap.docChanges().forEach(async c => {
        if (c.type === 'added' && !rtcState.id) {
          const data = c.doc.data();
          rtcState.id = c.doc.id;
          await ensureProfiles([data.callerId]);
          renderCallOverlay(getUser(data.callerId), data.type, tr('incomingCall'), true);
        }
      });
    }));
}

async function acceptIncomingCall() {
  const callRef = db.collection('calls').doc(rtcState.id);
  const snap = await callRef.get();
  const data = snap.data();
  if (!data) return;

  rtcState.local = await navigator.mediaDevices.getUserMedia({
    audio: true,
    video: data.type === 'video'
  });

  const pc = new RTCPeerConnection(RTC_CONFIG);
  rtcState.pc = pc;
  rtcState.remote = new MediaStream();

  rtcState.local.getTracks().forEach(t => pc.addTrack(t, rtcState.local));
  pc.ontrack = e => {
    e.streams[0].getTracks().forEach(t => rtcState.remote.addTrack(t));
    const rv = $('remote-video');
    if (rv) rv.srcObject = rtcState.remote;
  };

  pc.onicecandidate = e => {
    if (e.candidate) callRef.collection('calleeCandidates').add(e.candidate.toJSON());
  };

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await callRef.update({
    status: 'connected',
    answer: { type: answer.type, sdp: answer.sdp }
  });

  renderCallOverlay(getUser(data.callerId), data.type, 'Connected', false);
  startCallTimer();

  rtcState.unsubs.push(callRef.collection('callerCandidates').onSnapshot(s => {
    s.docChanges().forEach(c => {
      if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));
    });
  }));
  rtcState.unsubs.push(callRef.onSnapshot(s => {
    if (s.data() && s.data().status === 'ended') endWebRTCCall(false);
  }));
}

async function endWebRTCCall(updateDb = true) {
  const id = rtcState.id;
  clearInterval(rtcState.timer);
  rtcState.unsubs.forEach(u => u());
  rtcState.unsubs = [];
  if (rtcState.pc) { rtcState.pc.close(); rtcState.pc = null; }
  if (rtcState.local) { rtcState.local.getTracks().forEach(t => t.stop()); rtcState.local = null; }
  rtcState.id = null;
  $('callroot').style.display = 'none';
  $('callroot').innerHTML = '';
  if (updateDb && id) {
    try { await db.collection('calls').doc(id).update({ status: 'ended' }); } catch (_) {}
  }
}

function renderCallOverlay(peer, type, statusText, isIncoming) {
  const root = $('callroot');
  root.style.display = 'flex';
  root.innerHTML = `
    <div class="relative flex-1 flex flex-col items-center justify-center p-6">

      <video id="local-video" autoplay playsinline muted class="absolute top-5 right-5 w-28 h-40 rounded-2xl object-cover border border-white/20 z-10 ${type === 'video' ? '' : 'hidden'}"></video>

      ` : `

      `}
    </div>`;
  const lv = $('local-video');
  if (lv && rtcState.local) lv.srcObject = rtcState.local;
}

async function claimPromotionalBadge() {
  const uid = state.user.uid;
  try {
    await db.runTransaction(async tx => {
      const promoRef = db.collection('meta').doc('badge_promo');
      const userRef = db.collection('users').doc(uid);
      const allocRef = db.collection('badge_allocations').doc(uid);

      const [pSnap, uSnap, aSnap] = await Promise.all([tx.get(promoRef), tx.get(userRef), tx.get(allocRef)]);
      if (aSnap.exists || (uSnap.exists && uSnap.data().verified)) throw new Error('ALREADY_VERIFIED');

      const count = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      if (count >= APP_CONFIG.FREE_BADGE_LIMIT) throw new Error('LIMIT_REACHED');

      const expires = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 365 * 24 * 3600 * 1000));
      tx.set(promoRef, { allocatedCount: count + 1 }, { merge: true });
      tx.set(allocRef, { uid, type: 'free_first_30', allocatedAt: TS(), expiresAt: expires });
      tx.update(userRef, { verified: true, badgeType: 'free_first_30', badgeExpiresAt: expires });
    });
    showToast(tr('toastClaimed'));
  } catch (err) {
    showToast(err.message === 'LIMIT_REACHED' ? 'All 30 free badges have been claimed.' : tr('errGeneric'));
  }
}

async function initiatePremiumSubscription() {
  const uid = state.user.uid;
  const txRef = $('pay-ref') ? $('pay-ref').value.trim() : '';
  await db.collection('payment_records').add({

}

            </button>
          </div>
          ${commentsOpen ? `
            <div class="pt-3 border-t line space-y-2.5">

            </button>
            <span class="muted">💬 ${(m.comments || []).length}</span>
            ${isMine ? `

function searchTag(tag) {
  state.tab = 'explore';
  state.searchQuery = tag;
  render();
}

function renderExploreView() {
  const q = state.searchQuery.trim().toLowerCase();
  const cleanQ = q.replace(/^@/, '');

  const matchingUsers = state.allUsers.filter(u => {
    if (u.id === state.user.uid || state.blockedIds.includes(u.id)) return false;
    if (!q) return true;
    return (u.name || '').toLowerCase().includes(cleanQ) || (u.username || '').toLowerCase().includes(cleanQ);
  }).slice(0, 15);

  const matchingPosts = q ? state.posts.filter(p => (p.caption || '').toLowerCase().includes(q)) : [];

  // Aggregate trending hashtags
  const tagCounts = {};
  state.posts.forEach(p => (p.hashtags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
  const topTags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);

  return `<div class="space-y-5">
    <h2 class="text-xl font-bold">${tr('explore')}</h2>
    <input id="explore-search" value="${esc(state.searchQuery)}" oninput="state.searchQuery=this.value;render()" placeholder="${tr('searchPh')}" class="input">

    ${topTags.length ? `
      <div class="space-y-2">
        <div class="text-xs uppercase font-semibold muted">${tr('trendingTags')}</div>
        <div class="flex flex-wrap gap-2">
          ${topTags.map(([tag, cnt]) => `<button onclick="searchTag('${esc(tag)}')" class="soft px-3 py-1.5 rounded-full text-xs font-medium text-blue-400 border line">${esc(tag)} (${cnt})</button>`).join('')}
        </div>
      </div>` : ''}

    <div class="space-y-2.5">
      <div class="text-xs uppercase font-semibold muted">${tr('suggestedPeople')}</div>
      ${matchingUsers.map(u => {
        const isFollowing = state.followingIds.includes(u.id);
        return `<div class="card p-3.5 flex items-center gap-3">
          <div onclick="openUserProfile('${u.id}')" class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer">
            ${avatarHTML(u, 'w-11 h-11')}
            <div class="min-w-0">
              <div class="font-semibold text-sm truncate flex items-center">${esc(u.name)}${verificationBadge(u)}</div>
              <div class="text-xs muted truncate">@${esc(u.username)}</div>
            </div>
          </div>
          <button onclick="toggleFollow('${u.id}')" class="${isFollowing ? 'btn-ghost' : 'btn'} text-xs py-2 px-3.5">
            ${isFollowing ? tr('following') : tr('follow')}
          </button>
        </div>`;
      }).join('') || `<p class="text-sm muted text-center py-6">${tr('nobodyFound')}</p>`}
    </div>

    ${matchingPosts.length ? `
      <div class="space-y-3">
        <div class="text-xs uppercase font-semibold muted">Matching Posts (${matchingPosts.length})</div>
        ${matchingPosts.map(p => `<div class="card p-3.5 text-sm">${formatRichText(p.caption)}</div>`).join('')}
      </div>` : ''}
  </div>`;
}

        ${state.replyToMsg ? `<div class="px-4 py-1.5 soft border-t line flex justify-between text-xs"><span>${tr('replyingTo')}: ${esc(state.replyToMsg.text)}</span><button onclick="state.replyToMsg=null;render()">✕</button></div>` : ''}

}

function renderSettingsView() {
  return `<div class="space-y-5">
    <h2 class="text-xl font-bold">${tr('settings')}</h2>

    <div class="card p-4 space-y-4">
      <div>
        <div class="text-xs muted mb-2">${tr('language')}</div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setLang('en')" class="py-2 rounded-xl text-xs font-semibold ${lang==='en' ? 'btn' : 'btn-ghost'}">English</button>
          <button onclick="setLang('ru')" class="py-2 rounded-xl text-xs font-semibold ${lang==='ru' ? 'btn' : 'btn-ghost'}">Русский</button>
        </div>
      </div>

      <div>
        <div class="text-xs muted mb-2">${tr('appearance')}</div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setTheme('dark')" class="py-2 rounded-xl text-xs font-semibold ${theme==='dark' ? 'btn' : 'btn-ghost'}">🌙 ${tr('dark')}</button>
          <button onclick="setTheme('light')" class="py-2 rounded-xl text-xs font-semibold ${theme==='light' ? 'btn' : 'btn-ghost'}">☀️ ${tr('light')}</button>
        </div>
      </div>

      <button onclick="state.tab='verification';render()" class="btn-ghost w-full py-2.5 text-xs flex items-center justify-between px-4">
        <span>✔ ${tr('verificationTitle')}</span>
        <span>→</span>
      </button>
    </div>

    <div class="card p-4 space-y-3">
      <div class="text-xs font-bold uppercase muted">${tr('privacySecurity')}</div>
      <div class="flex gap-2">
        <input id="new-pass-input" type="password" placeholder="${tr('newPassword')}" class="input text-xs">
        <button onclick="changeAccountPassword()" class="btn text-xs shrink-0">${tr('updatePassword')}</button>
      </div>
    </div>

    <div class="card p-4 space-y-2 text-xs">
      <div class="font-bold text-sm">${tr('aboutApp')}</div>
      <p class="muted leading-relaxed">${tr('aboutDesc')}</p>
      <div class="pt-2 border-t line flex justify-between muted font-medium">
        <span>Moodgram v2.0</span>
        <span>${tr('byline')}</span>
      </div>
    </div>

    <div class="space-y-2">
      <button onclick="logoutUser()" class="btn-ghost w-full py-3 text-rose-400 font-semibold">${tr('logout')}</button>
      <button onclick="deleteEntireAccount()" class="w-full py-2 text-xs text-rose-500/70 hover:text-rose-500">${tr('deleteAccount')}</button>
    </div>
  </div>`;
}

function renderModals() {
  const root = $('modalroot');
  if (!state.activeModal) { root.innerHTML = ''; return; }

  if (state.activeModal === 'mood') {
    root.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
        <div class="card w-full md:max-w-md rounded-b-none md:rounded-3xl p-5 space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-base">${state.editingMoodId ? tr('editMood') : tr('shareMood')}</h3>
            <button onclick="state.activeModal=null;render()" class="muted text-lg">✕</button>
          </div>
          <div class="grid grid-cols-5 gap-2">
            ${MOOD_LIST.map(m => `
              <button onclick="state.selectedMood='${m.emoji}';render()" class="mood-chip mx-auto ${state.selectedMood===m.emoji ? 'on' : ''}" title="${m[lang]}">
                ${m.emoji}
              </button>
            `).join('')}
          </div>
          <textarea oninput="state.moodDraft=this.value" rows="3" maxlength="240" placeholder="${tr('moodExplainPh')}" class="input resize-none">${esc(state.moodDraft)}</textarea>
          <button onclick="saveMoodPost()" class="btn w-full py-3">${tr('postMood')}</button>
        </div>
      </div>`;
  } else if (state.activeModal === 'post') {
    root.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
        <div class="card w-full md:max-w-md rounded-b-none md:rounded-3xl p-5 space-y-3.5">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-base">${tr('newPost')}</h3>
            <button onclick="state.activeModal=null;render()" class="muted text-lg">✕</button>
          </div>
          <textarea oninput="state.postCaption=this.value" rows="3" placeholder="${tr('writeCaption')}" class="input resize-none">${esc(state.postCaption)}</textarea>
          <input value="${esc(state.postLocation)}" oninput="state.postLocation=this.value" placeholder="${tr('locationPh')}" class="input text-xs">
          <input value="${esc(state.postImageUrl)}" oninput="state.postImageUrl=this.value" placeholder="${tr('imageUrlPh')}" class="input text-xs">
          <label class="btn-ghost w-full py-2.5 text-center block cursor-pointer text-xs">
            📷 Upload Photo from Device
            <input type="file" accept="image/*" hidden onchange="handlePostFileSelect(this)">
          </label>
          ${state.postImageData ? `<img src="${state.postImageData}" class="h-32 w-full object-cover rounded-xl">` : ''}
          <button onclick="publishPost()" class="btn w-full py-3">${tr('publish')}</button>
        </div>
      </div>`;
  } else if (state.activeModal === 'edit_profile') {
    const p = state.profile;
    root.innerHTML = `
      <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
        <form onsubmit="updateProfileDetails(event)" class="card w-full max-w-md p-5 space-y-3">
          <div class="flex justify-between items-center">
            <h3 class="font-bold">${tr('editProfile')}</h3>
            <button type="button" onclick="state.activeModal=null;render()" class="muted">✕</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input id="ep-fname" value="${esc(p.firstName || '')}" placeholder="${tr('firstName')}" class="input" required>
            <input id="ep-lname" value="${esc(p.lastName || '')}" placeholder="${tr('lastName')}" class="input">
          </div>
          <textarea id="ep-bio" rows="2" placeholder="${tr('bio')}" class="input">${esc(p.bio || '')}</textarea>
          <input id="ep-web" value="${esc(p.website || '')}" placeholder="${tr('website')}" class="input">
          <label class="flex items-center gap-2 text-xs pt-1">
            <input id="ep-priv" type="checkbox" ${p.isPrivate ? 'checked' : ''}>
            <span>${tr('privateAccount')}</span>
          </label>
          <button type="submit" class="btn w-full py-3">Save Profile</button>
        </form>
      </div>`;
  }
}

function viewStory(storyId) {
  const s = state.stories.find(x => x.id === storyId);
  if (!s) return;
  const u = getUser(s.uid);
  $('modalroot').innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4" onclick="state.activeModal=null;renderModals()">
      <div class="max-w-sm w-full space-y-3">
        <div class="flex items-center gap-2.5 text-white">
          ${avatarHTML(u, 'w-9 h-9')}
          <span class="font-semibold text-sm">@${esc(u.username)}</span>
          <span class="text-xs opacity-60 ml-auto">${timeAgo(tsToMs(s))}</span>
        </div>
        <img src="${esc(s.image)}" class="w-full max-h-[75vh] object-contain rounded-2xl">
      </div>
    </div>`;
}

/* ============================================================================
   14. NAVIGATION & MASTER RENDER LOOP
   ============================================================================ */
function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('mg_lang', newLang);
  if (db && state.user && state.profile) {
    db.collection('users').doc(state.user.uid).update({ language: newLang }).catch(() => {});
  }
  render();
}

function setTheme(newTheme) {
  theme = newTheme;
  localStorage.setItem('mg_theme', newTheme);
  document.documentElement.classList.toggle('light', newTheme === 'light');
  render();
}

function renderChrome() {
  const loggedIn = !!(state.user && state.profile);
  const navItems = [
    ['home', '🏠', tr('home')],
    ['mood', '😊', tr('moodTab')],
    ['explore', '🔍', tr('explore')],
    ['chats', '💬', tr('chats')],
    ['notifs', '🔔', tr('notifs')],
    ['profile', '👤', tr('profile')],
    ['settings', '⚙️', tr('settings')]
  ];

  $('side').innerHTML = loggedIn ? `
    <div class="flex items-center gap-3 px-2 py-3">
      ${logoSVG('w-10 h-10')}
      <div>
        <div class="text-xl logo-text leading-none">Moodgram</div>
        <div class="text-[10px] muted mt-0.5">${tr('byline')}</div>
      </div>
    </div>
    <div class="space-y-1 mt-4 flex-1">
      ${navItems.map(([k, icon, label]) => `
        <button onclick="state.tab='${k}';state.chatWith=null;render()" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-sm transition ${state.tab===k ? 'soft font-bold text-blue-400 border line' : 'muted hover:soft'}">
          <span class="text-lg">${icon}</span>
          <span>${label}</span>
        </button>
      `).join('')}
    </div>
    <button onclick="openMoodComposer()" class="btn w-full py-3 mb-2">+ ${tr('shareMood')}</button>
    <div class="text-[10px] text-center muted py-1">${tr('byline')}</div>
  ` : '';

  $('top').innerHTML = loggedIn ? `
    <div class="flex items-center gap-2.5">
      ${logoSVG('w-8 h-8')}
      <span class="text-lg logo-text">Moodgram</span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="state.tab='notifs';render()" class="text-lg">🔔</button>
      <button onclick="state.tab='settings';render()" class="text-lg">⚙️</button>
    </div>
  ` : '';

  // Mobile Bottom Bar: Home | Mood (Replaces Reels!) | + | Messages | Profile
  $('nav').innerHTML = loggedIn && !state.chatWith ? `
    <button onclick="state.tab='home';render()" class="flex-1 flex flex-col items-center text-[10px] ${state.tab==='home'?'text-blue-400 font-bold':'muted'}"><span class="text-xl">🏠</span>${tr('home')}</button>
    <button onclick="state.tab='mood';render()" class="flex-1 flex flex-col items-center text-[10px] ${state.tab==='mood'||state.tab==='friends_mood'?'text-blue-400 font-bold':'muted'}"><span class="text-xl">😊</span>Mood</button>
    <button onclick="openMoodComposer()" class="-mt-5 w-13 h-13 px-3.5 py-2.5 rounded-full grad text-white text-2xl shadow-lg">+</button>
    <button onclick="state.tab='chats';render()" class="flex-1 flex flex-col items-center text-[10px] ${state.tab==='chats'?'text-blue-400 font-bold':'muted'}"><span class="text-xl">💬</span>${tr('chats')}</button>
    <button onclick="state.tab='profile';render()" class="flex-1 flex flex-col items-center text-[10px] ${state.tab==='profile'?'text-blue-400 font-bold':'muted'}"><span class="text-xl">👤</span>${tr('profile')}</button>
  ` : '';

  $('side').classList.toggle('md:flex', loggedIn);
  $('top').classList.toggle('hidden', !loggedIn);
  $('nav').classList.toggle('hidden', !loggedIn || !!state.chatWith);
}

function renderMain() {
  const loggedIn = !!(state.user && state.profile);
  if (!loggedIn) {
    $('main').className = 'px-4 max-w-md mx-auto min-h-screen flex flex-col justify-between';
    $('main').innerHTML = `
      <div class="flex-1 flex flex-col justify-center">${renderAuthScreen()}</div>
      <footer class="text-center py-5 space-y-1">
        <div class="text-[11px] uppercase tracking-widest muted font-semibold">${tr('byline')}</div>
      </footer>`;
    return;
  }

  $('main').className = 'px-4 py-4 pb-28 md:pb-10 md:ml-64 max-w-2xl mx-auto min-h-screen';
  const routes = {
    home: () => renderHomeView(),
    mood: () => renderMoodTimelineView(false),
    friends_mood: () => renderMoodTimelineView(true),
    explore: () => renderExploreView(),
    chats: () => renderChatsView(),
    notifs: () => renderNotifsView(),
    profile: () => renderProfileView(null),
    user_profile: () => renderProfileView(state.viewUserId),
    verification: () => renderVerificationView(),
    settings: () => renderSettingsView()
  };
  $('main').innerHTML = (routes[state.tab] || routes.home)();
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle('light', theme === 'light');
  renderChrome();
  renderMain();
  renderModals();
}

render();
</script>
</body>
</html>
