    --border: #dce2f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;

    --neon: rgba(37, 99, 235, 0.14);

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    overflow-x: hidden;
    margin: 0;

  .card {
    background: var(--card);

    border-radius: 22px;

  }
  .glass {
    background: rgba(14, 19, 34, 0.86);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  html.light .glass { background: rgba(255, 255, 255, 0.9); }
  .soft { background: var(--card2); }
  .muted { color: var(--muted); }
  .line { border-color: var(--border); }
  .input {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    padding: 11px 14px;
    width: 100%;
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--neon);
  }
  .btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff;
    border-radius: 14px;
    font-weight: 600;
    padding: 10px 16px;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    border: none;
    transition: transform 0.12s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-ghost {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-weight: 600;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.12s;
  }
  .btn-ghost:active { transform: scale(0.97); }
  .grad { background: linear-gradient(135deg, #1d4ed8, #3b82f6, #8b5cf6); }
  .ig-ring { background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #f59e0b); }
  .logo-text {
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hs::-webkit-scrollbar { display: none; }
  .hs { scrollbar-width: none; }
  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.82); }
  .mood-chip {
    font-size: 26px;
    width: 52px;
    height: 52px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid transparent;
    background: var(--card2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .mood-chip.on {
    border-color: var(--accent);
    background: var(--neon);
    transform: scale(1.06);
  }
  #toast { transition: opacity 0.25s, transform 0.25s; }
  .call-root {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: #05070e;
    flex-direction: column;
    color: #fff;

/* ============================================================================
   3. BUILT-IN SOUND EFFECTS ENGINE (SMS, NOTIFICATION, RINGTONE)
   ============================================================================ */
let soundEnabled = localStorage.getItem('mg_sound') !== 'off';
let audioCtx = null;

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'msg_in') {
      // Crisp double-pop SMS sound
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, now);
      osc.frequency.setValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'msg_out') {
      // Subtle send whoosh-pop
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(720, now + 0.09);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
      osc.start(now);
      osc.stop(now + 0.11);
    } else if (type === 'notif') {
      // Pleasant notification chime
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(659.25, now);
      osc.frequency.setValueAtTime(987.77, now + 0.1);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'ring') {
      // Incoming call tone
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.15);
      osc.frequency.setValueAtTime(783.99, now + 0.3);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  } catch (_) {}
}

function timeAgo(ms) {
  const diff = Math.max(0, Date.now() - ms);
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return lang === 'ru' ? 'только что' : 'just now';
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h';
  return Math.floor(hrs / 24) + 'd';
}

/* ============================================================================
   6. REALTIME ONLINE / OFFLINE PRESENCE ENGINE
   ============================================================================ */
let presenceTimer = null;

function isUserTrulyOnline(u) {
  if (!u || !u.online) return false;
  if (!u.lastSeen || !u.lastSeen.toMillis) return !!u.online;
  // Considered online only if heartbeat was received in last 50 seconds
  return (Date.now() - u.lastSeen.toMillis()) < 50000;
}

function getPresenceLabel(u) {
  if (isUserTrulyOnline(u)) {
    return `<span class="inline-flex items-center gap-1.5 text-emerald-400 font-medium"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>${tr('online')}</span>`;
  }
  const seenMs = (u && u.lastSeen && u.lastSeen.toMillis) ? u.lastSeen.toMillis() : 0;
  return `<span class="muted">${tr('offline')}${seenMs ? ' · ' + tr('lastSeen') + ' ' + timeAgo(seenMs) : ''}</span>`;
}

async function setPresence(isOnline) {
  if (!db || !state.user) return;
  try {
    await db.collection('users').doc(state.user.uid).update({
      online: isOnline,
      lastSeen: TS()
    });
  } catch (_) {}
}

function startPresenceHeartbeat() {
  stopPresenceHeartbeat();
  setPresence(true);
  presenceTimer = setInterval(() => {
    if (document.visibilityState === 'visible') setPresence(true);
  }, 25000);
}

function stopPresenceHeartbeat() {
  if (presenceTimer) { clearInterval(presenceTimer); presenceTimer = null; }
}

document.addEventListener('visibilitychange', () => {
  if (!state.user || !state.profile) return;
  if (document.visibilityState === 'hidden') setPresence(false);
  else setPresence(true);
});

window.addEventListener('pagehide', () => { if (state.user) setPresence(false); });
window.addEventListener('beforeunload', () => { if (state.user) setPresence(false); });

function formatRichText(text) {

  safe = safe.replace(/(#[a-zA-Z0-9_а-яА-ЯёЁ]+)/g, '<span class="text-blue-400 font-medium cursor-pointer" onclick="searchTag(\'$1\')">$1</span>');
  safe = safe.replace(/(@[a-zA-Z0-9_]+)/g, '<span class="text-purple-400 font-medium">$1</span>');
  return safe;
}

function compressImageFile(file, maxDim = 600, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handleRegister(e) {
  e.preventDefault();
  const firstName = $('reg-fname').value.trim();
  const lastName = $('reg-lname').value.trim();
  const username = $('reg-user').value.trim().toLowerCase().replace(/^@/, '');
  const email = $('reg-email').value.trim().toLowerCase();
  const dob = $('reg-dob').value;
  const prefLang = $('reg-lang').value;
  const pass = $('reg-pass').value;
  const confirm = $('reg-cpass').value;

  if (!firstName || !lastName || !username || !email || !dob || !pass) { state.error = tr('errFields'); return render(); }
  if (!/^[a-z0-9_]{3,20}$/.test(username)) { state.error = tr('errUsername'); return render(); }
  if (pass.length < 6) { state.error = tr('errPassLen'); return render(); }
  if (pass !== confirm) { state.error = tr('errPassMatch'); return render(); }

  state.busy = true; state.error = ''; render();
  try {
    const unameDoc = await db.collection('usernames').doc(username).get();
    if (unameDoc.exists) { state.busy = false; state.error = tr('errUserTaken'); return render(); }

    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const fullName = firstName + ' ' + lastName;

    await db.runTransaction(async tx => {
      const uRef = db.collection('usernames').doc(username);
      const promoRef = db.collection('meta').doc('badge_promo');
      const uSnap = await tx.get(uRef);
      if (uSnap.exists) throw new Error('USERNAME_TAKEN');

      const pSnap = await tx.get(promoRef);
      const allocated = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      const getsFreeBadge = allocated < APP_CONFIG.FREE_BADGE_LIMIT;
      const oneYearFromNow = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 365 * 24 * 60 * 60 * 1000));

      tx.set(uRef, { uid, email, createdAt: TS() });
      if (getsFreeBadge) {
        tx.set(promoRef, { allocatedCount: allocated + 1 }, { merge: true });
        tx.set(db.collection('badge_allocations').doc(uid), { uid, type: 'free_first_30', allocatedAt: TS(), expiresAt: oneYearFromNow });
      }
      tx.set(db.collection('users').doc(uid), {
        firstName, lastName, name: fullName, username, email, dob,
        language: prefLang, bio: '', website: '', photo: state.regPhotoData || '',
        isPrivate: false, verified: getsFreeBadge,
        badgeType: getsFreeBadge ? 'free_first_30' : 'none',
        badgeExpiresAt: getsFreeBadge ? oneYearFromNow : null,
        savedPosts: [], online: true, lastSeen: TS(), createdAt: TS()
      });
    });

    state.regPhotoData = '';
    setLang(prefLang);
    state.busy = false;
  } catch (err) {
    state.busy = false;
    state.error = err.message === 'USERNAME_TAKEN' ? tr('errUserTaken') : (err.message || tr('errGeneric'));
    render();
  }
}

async function handleLogin(e) {
  e.preventDefault();
  const identifier = $('log-id').value.trim().toLowerCase();
  const pass = $('log-pass').value;
  if (!identifier || !pass) { state.error = tr('errFields'); return render(); }

  state.busy = true; state.error = ''; render();
  try {
    let loginEmail = identifier;
    if (!identifier.includes('@') || identifier.startsWith('@')) {
      const cleanUser = identifier.replace(/^@/, '');
      const mapDoc = await db.collection('usernames').doc(cleanUser).get();
      if (!mapDoc.exists || !mapDoc.data().email) {
        state.busy = false; state.error = tr('errUserNotFound'); return render();
      }
      loginEmail = mapDoc.data().email;
    }
    await auth.signInWithEmailAndPassword(loginEmail, pass);
    state.busy = false;
  } catch (err) {
    state.busy = false;
    state.error = err.message || tr('errGeneric');
    render();
  }
}

      const uSnap = await tx.get(uRef);
      if (uSnap.exists) throw new Error('USERNAME_TAKEN');

      const pSnap = await tx.get(promoRef);
      const allocated = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      const getsFreeBadge = allocated < APP_CONFIG.FREE_BADGE_LIMIT;
      const oneYearFromNow = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 365 * 24 * 60 * 60 * 1000));

      tx.set(uRef, { uid, email, createdAt: TS() });
      if (getsFreeBadge) tx.set(promoRef, { allocatedCount: allocated + 1 }, { merge: true });
      tx.set(db.collection('users').doc(uid), {
        firstName, lastName, name: (firstName + ' ' + lastName).trim(),
        username, email, language: lang, bio: '', website: '',
        photo: state.user.photoURL || '', isPrivate: false,
        verified: getsFreeBadge, badgeType: getsFreeBadge ? 'free_first_30' : 'none',
        badgeExpiresAt: getsFreeBadge ? oneYearFromNow : null,
        savedPosts: [], online: true, lastSeen: TS(), createdAt: TS()
      });
    });

    const fresh = await db.collection('users').doc(uid).get();
    state.profile = { id: uid, ...fresh.data() };
    state.profilesCache.set(uid, state.profile);
    state.busy = false;
    startPresenceHeartbeat();
    initRealtimeListeners();
    render();
  } catch (err) {
    state.busy = false;
    state.error = err.message === 'USERNAME_TAKEN' ? tr('errUserTaken') : tr('errGeneric');
    render();
  }
}

function addSub(unsub) { state.unsubs.push(unsub); }
function cleanupSubscriptions() {
  state.unsubs.forEach(fn => { try { fn(); } catch (_) {} });
  state.unsubs = [];
  if (state.chatUnsub) { state.chatUnsub(); state.chatUnsub = null; }
}

function initRealtimeListeners() {
  cleanupSubscriptions();
  state.initialNotifsLoaded = false;
  const uid = state.user.uid;

  addSub(db.collection('users').doc(uid).onSnapshot(doc => {
    if (doc.exists) {
      state.profile = { id: uid, ...doc.data() };
      state.profilesCache.set(uid, state.profile);
      render();
    }
  }));

  addSub(db.collection('meta').doc('badge_promo').onSnapshot(doc => {
    state.badgeCountUsed = doc.exists ? (doc.data().allocatedCount || 0) : 0;
    render();
  }));

  addSub(db.collection('follows').where('followerId', '==', uid).onSnapshot(snap => {
    state.followingIds = snap.docs.map(d => d.data().followingId);
    ensureProfiles(state.followingIds);
    render();
  }));

  addSub(db.collection('follows').where('followingId', '==', uid).onSnapshot(snap => {
    state.followerIds = snap.docs.map(d => d.data().followerId);
    ensureProfiles(state.followerIds);
    render();
  }));

  addSub(db.collection('blocks').where('blockerId', '==', uid).onSnapshot(snap => {
    state.blockedIds = snap.docs.map(d => d.data().blockedId);
    render();
  }));

  addSub(db.collection('posts').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
    state.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.posts.map(p => p.uid));
    render();
  }));

  addSub(db.collection('moods').orderBy('createdAt', 'desc').limit(80).onSnapshot(snap => {
    state.moods = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.moods.map(m => m.uid));
    render();
  }));

  addSub(db.collection('stories').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
    const cutoff = Date.now() - 24 * 3600 * 1000;
    state.stories = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => tsToMs(s) > cutoff);
    ensureProfiles(state.stories.map(s => s.uid));
    render();
  }));

  addSub(db.collection('notifications').doc(uid).collection('items').orderBy('createdAt', 'desc').limit(40).onSnapshot(snap => {
    if (state.initialNotifsLoaded) {
      snap.docChanges().forEach(change => {
        if (change.type === 'added') {
          const n = change.doc.data();
          playSound(n.type === 'message' ? 'msg_in' : 'notif');
          showToast('@' + getUser(n.fromUid).username + ' ' + n.text);
        }
      });
    }
    state.initialNotifsLoaded = true;
    state.notifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ensureProfiles(state.notifs.map(n => n.fromUid));
    render();
  }));

  addSub(db.collection('users').limit(50).onSnapshot(snap => {
    state.allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.allUsers.forEach(u => state.profilesCache.set(u.id, u));
    render();
  }));

  watchIncomingCalls();
}

async function toggleVoiceRecording() {
  if (state.isRecording && state.mediaRecorder) {
    state.mediaRecorder.stop();
    state.isRecording = false;
    return render();
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.audioChunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = e => { if (e.data.size > 0) state.audioChunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onloadend = async () => {
        const cid = pairId(state.user.uid, state.chatWith);
        playSound('msg_out');
        await db.collection('conversations').doc(cid).collection('messages').add({
          senderId: state.user.uid, receiverId: state.chatWith, type: 'audio', audio: reader.result, text: 'Voice message', createdAt: TS()
        });
      };
      reader.readAsDataURL(blob);
    };
    mr.start();
    state.mediaRecorder = mr;
    state.isRecording = true;
    render();
  } catch (err) { showToast('Microphone permission required.'); }
}

// Save Call Record directly into the chat history
async function logCallToChat(peerUid, callType, callStatus, durationSec = 0) {
  if (!db || !state.user || !peerUid) return;
  const cid = pairId(state.user.uid, peerUid);
  const convRef = db.collection('conversations').doc(cid);
  const m = String(Math.floor(durationSec / 60)).padStart(2, '0');
  const s = String(durationSec % 60).padStart(2, '0');
  const durText = durationSec > 0 ? `${m}:${s}` : '';
  const summary = `${callType === 'video' ? 'Video Call' : 'Audio Call'} · ${callStatus}${durText ? ' (' + durText + ')' : ''}`;

  try {
    await convRef.set({ members: [state.user.uid, peerUid], lastMessage: summary, updatedAt: TS() }, { merge: true });
    await convRef.collection('messages').add({
      senderId: state.user.uid,
      receiverId: peerUid,
      type: 'call',
      callType,
      callStatus,
      duration: durText,
      text: summary,
      createdAt: TS()
    });
  } catch (_) {}
}

const RTC_CONFIG = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const rtcState = {
  id: null, peerUid: null, callType: 'audio', isCaller: false, connected: false,
  pc: null, local: null, remote: null, unsubs: [], timer: null, ringTimer: null, seconds: 0
};

function startCallTimer() {
  rtcState.connected = true;
  rtcState.seconds = 0;
  clearInterval(rtcState.ringTimer);
  clearInterval(rtcState.timer);
  rtcState.timer = setInterval(() => {
    rtcState.seconds++;
    const m = String(Math.floor(rtcState.seconds / 60)).padStart(2, '0');
    const s = String(rtcState.seconds % 60).padStart(2, '0');
    const el = $('call-timer');
    if (el) el.textContent = m + ':' + s;
  }, 1000);
}

async function startWebRTCCall(targetUid, callType) {
  if (rtcState.id) return;
  const peer = getUser(targetUid);
  const callRef = db.collection('calls').doc();
  rtcState.id = callRef.id;
  rtcState.peerUid = targetUid;
  rtcState.callType = callType;
  rtcState.isCaller = true;
  rtcState.connected = false;
  rtcState.seconds = 0;

  try {
    rtcState.local = await navigator.mediaDevices.getUserMedia({ audio: true, video: callType === 'video' });
  } catch (err) {
    rtcState.id = null;
    return showToast('Camera/Microphone access denied.');
  }
  const pc = new RTCPeerConnection(RTC_CONFIG);
  rtcState.pc = pc;
  rtcState.remote = new MediaStream();
  rtcState.local.getTracks().forEach(t => pc.addTrack(t, rtcState.local));
  pc.ontrack = e => {
    e.streams[0].getTracks().forEach(t => rtcState.remote.addTrack(t));
    const rv = $('remote-video');
    if (rv) rv.srcObject = rtcState.remote;
  };
  pc.onicecandidate = e => { if (e.candidate) callRef.collection('callerCandidates').add(e.candidate.toJSON()); };
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await callRef.set({
    callerId: state.user.uid, calleeId: targetUid, type: callType, status: 'ringing',
    offer: { type: offer.type, sdp: offer.sdp }, createdAt: TS()
  });
  renderCallOverlay(peer, callType, tr('calling'), false);

  rtcState.unsubs.push(callRef.onSnapshot(async snap => {
    const data = snap.data();
    if (!data) return;
    if (['ended', 'declined'].includes(data.status)) return endWebRTCCall(false, data.status);
    if (data.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
      startCallTimer();
    }
  }));
  rtcState.unsubs.push(callRef.collection('calleeCandidates').onSnapshot(snap => {
    snap.docChanges().forEach(c => { if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
}

function watchIncomingCalls() {
  addSub(db.collection('calls').where('calleeId', '==', state.user.uid).where('status', '==', 'ringing').onSnapshot(snap => {
    snap.docChanges().forEach(async c => {
      if (c.type === 'added' && !rtcState.id) {
        const data = c.doc.data();
        rtcState.id = c.doc.id;
        rtcState.peerUid = data.callerId;
        rtcState.callType = data.type;
        rtcState.isCaller = false;
        rtcState.connected = false;
        rtcState.seconds = 0;
        await ensureProfiles([data.callerId]);
        playSound('ring');
        rtcState.ringTimer = setInterval(() => playSound('ring'), 2500);
        renderCallOverlay(getUser(data.callerId), data.type, tr('incomingCall'), true);
      }
    });
  }));
}

async function acceptIncomingCall() {
  clearInterval(rtcState.ringTimer);
  const callRef = db.collection('calls').doc(rtcState.id);
  const data = (await callRef.get()).data();
  if (!data) return;
  rtcState.local = await navigator.mediaDevices.getUserMedia({ audio: true, video: data.type === 'video' });
  const pc = new RTCPeerConnection(RTC_CONFIG);
  rtcState.pc = pc;
  rtcState.remote = new MediaStream();
  rtcState.local.getTracks().forEach(t => pc.addTrack(t, rtcState.local));
  pc.ontrack = e => {
    e.streams[0].getTracks().forEach(t => rtcState.remote.addTrack(t));
    const rv = $('remote-video');
    if (rv) rv.srcObject = rtcState.remote;
  };
  pc.onicecandidate = e => { if (e.candidate) callRef.collection('calleeCandidates').add(e.candidate.toJSON()); };
  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  await callRef.update({ status: 'connected', answer: { type: answer.type, sdp: answer.sdp } });
  renderCallOverlay(getUser(data.callerId), data.type, 'Connected', false);
  startCallTimer();
  rtcState.unsubs.push(callRef.collection('callerCandidates').onSnapshot(s => {
    s.docChanges().forEach(c => { if (c.type === 'added') pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
  }));
  rtcState.unsubs.push(callRef.onSnapshot(s => { if (s.data() && s.data().status === 'ended') endWebRTCCall(false, 'ended'); }));
}

async function endWebRTCCall(updateDb = true, remoteStatus = 'ended') {
  const { id, peerUid, callType, isCaller, connected, seconds } = rtcState;
  clearInterval(rtcState.timer);
  clearInterval(rtcState.ringTimer);
  rtcState.unsubs.forEach(u => u());
  rtcState.unsubs = [];
  if (rtcState.pc) { rtcState.pc.close(); rtcState.pc = null; }
  if (rtcState.local) { rtcState.local.getTracks().forEach(t => t.stop()); rtcState.local = null; }
  rtcState.id = null;
  $('callroot').style.display = 'none';
  $('callroot').innerHTML = '';

  // Caller writes the call record into the chat conversation so both users see it
  if (isCaller && peerUid) {
    const finalStatus = connected ? 'Completed' : (remoteStatus === 'declined' ? 'Declined' : 'Missed');
    await logCallToChat(peerUid, callType, finalStatus, seconds);
  }

  if (updateDb && id) {
    try {
      const st = (!isCaller && !connected) ? 'declined' : 'ended';
      await db.collection('calls').doc(id).update({ status: st });
    } catch (_) {}
  }
}

function renderCallOverlay(peer, type, statusText, isIncoming) {
  const root = $('callroot');
  root.style.display = 'flex';
  root.innerHTML = `
    <div class="relative flex-1 flex flex-col items-center justify-center p-6">
      <video id="remote-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover opacity-80"></video>
      <video id="local-video" autoplay playsinline muted class="absolute top-5 right-5 w-28 h-40 rounded-2xl object-cover border border-white/20 z-10 ${type === 'video' ? '' : 'hidden'}"></video>
      <div class="relative z-10 text-center space-y-3 bg-black/55 backdrop-blur-md px-8 py-6 rounded-3xl border border-white/10">
        ${avatarHTML(peer, 'w-24 h-24 mx-auto', 'text-3xl')}
        <h3 class="text-xl font-bold">${esc(peer.name)}</h3>
        <p id="call-timer" class="text-sm text-blue-300 font-mono">${esc(statusText)}</p>
      </div>
    </div>
    <div class="p-8 flex justify-center gap-8 bg-black/80 z-10">
      ${isIncoming ? `
        <button onclick="endWebRTCCall(true)" class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-white shadow-lg">✕</button>
        <button onclick="acceptIncomingCall()" class="w-16 h-16 rounded-full bg-emerald-500 flex items-center justify-center text-white shadow-lg">${ICONS.phone()}</button>
      ` : `
        <button onclick="endWebRTCCall(true)" class="w-16 h-16 rounded-full bg-rose-600 flex items-center justify-center text-white shadow-lg">✕</button>
      `}
    </div>`;
  const lv = $('local-video'); if (lv && rtcState.local) lv.srcObject = rtcState.local;
  const rv = $('remote-video'); if (rv && rtcState.remote) rv.srcObject = rtcState.remote;

async function claimPromotionalBadge() {
  const uid = state.user.uid;
  try {
    await db.runTransaction(async tx => {
      const promoRef = db.collection('meta').doc('badge_promo');
      const userRef = db.collection('users').doc(uid);
      const allocRef = db.collection('badge_allocations').doc(uid);
      const [pSnap, uSnap, aSnap] = await Promise.all([tx.get(promoRef), tx.get(userRef), tx.get(allocRef)]);
      if (aSnap.exists || (uSnap.exists && uSnap.data().verified)) throw new Error('ALREADY_VERIFIED');
      const count = pSnap.exists ? (pSnap.data().allocatedCount || 0) : 0;
      if (count >= APP_CONFIG.FREE_BADGE_LIMIT) throw new Error('LIMIT_REACHED');
      const expires = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 365 * 24 * 3600 * 1000));
      tx.set(promoRef, { allocatedCount: count + 1 }, { merge: true });
      tx.set(allocRef, { uid, type: 'free_first_30', allocatedAt: TS(), expiresAt: expires });
      tx.update(userRef, { verified: true, badgeType: 'free_first_30', badgeExpiresAt: expires });
    });
    playSound('notif');
    showToast(tr('toastClaimed'));
  } catch (err) {
    showToast(err.message === 'LIMIT_REACHED' ? 'All 30 free badges have been claimed.' : tr('errGeneric'));
  }
}

async function initiatePremiumSubscription() {
  const txRef = $('pay-ref') ? $('pay-ref').value.trim() : '';
  await db.collection('payment_records').add({
    uid: state.user.uid, amountUsd: APP_CONFIG.PREMIUM_PRICE_USD, currency: 'USD',
    provider: APP_CONFIG.PAYMENT_PROVIDER, reference: txRef || 'PENDING_GATEWAY_WEBHOOK',
    status: 'pending_verification', createdAt: TS()
  });
  showToast(tr('paymentPending'));
}

async function updateProfileDetails(e) {
  e.preventDefault();
  const firstName = $('ep-fname').value.trim();
  const lastName = $('ep-lname').value.trim();
  const bio = $('ep-bio').value.trim();
  const website = $('ep-web').value.trim();

async function updateAvatarPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const photo = await compressImageFile(file, 320, 0.85);
  await db.collection('users').doc(state.user.uid).update({ photo });
  showToast(tr('toastSaved'));
}

        <div class="flex-1 min-w-0">
          <div class="font-semibold text-sm truncate flex items-center">${esc(u.name)}${verificationBadge(u)}</div>
          <div class="text-xs truncate">@${esc(u.username)} · ${getPresenceLabel(u)}</div>
        </div>
        <span class="text-blue-400">${ICONS.chats(false)}</span>
      </button>`;
    }).join('') || `<div class="card p-10 text-center text-sm muted">${tr('noChats')}</div>`}
  </div>`;
}

function renderProfileView(targetUid = null) {
  const isMe = !targetUid || targetUid === state.user.uid;
  const u = isMe ? state.profile : getUser(targetUid);
  const userPosts = state.posts.filter(p => p.uid === u.id);
  const userMoods = state.moods.filter(m => m.uid === u.id);
  const isFollowing = state.followingIds.includes(u.id);
  return `<div class="space-y-5">
    <div class="card p-5 space-y-4">
      <div class="flex items-start gap-4">
        <div class="relative">
          ${avatarHTML(u, 'w-20 h-20', 'text-2xl', true)}
          ${isMe ? `<label class="absolute -bottom-1 -right-1 w-7 h-7 rounded-full grad text-white flex items-center justify-center cursor-pointer">${ICONS.camera()}<input type="file" accept="image/*" hidden onchange="updateAvatarPhoto(this)"></label>` : ''}
        </div>
        <div class="flex-1 min-w-0 space-y-1">
          <h2 class="text-lg font-bold truncate flex items-center">${esc(u.name)}${verificationBadge(u, 18)}</h2>
          <p class="text-xs text-blue-400 font-medium">@${esc(u.username)} · ${getPresenceLabel(u)}</p>
          ${u.bio ? `<p class="text-xs leading-relaxed pt-1">${esc(u.bio)}</p>` : ''}
        </div>
      </div>
      <div class="grid grid-cols-3 text-center py-2.5 border-y line">
        <div><div class="font-bold text-base">${userPosts.length}</div><div class="text-[11px] muted">${tr('allPosts')}</div></div>
        <div><div class="font-bold text-base">${isMe ? state.followerIds.length : '—'}</div><div class="text-[11px] muted">${tr('followers')}</div></div>
        <div><div class="font-bold text-base">${isMe ? state.followingIds.length : '—'}</div><div class="text-[11px] muted">${tr('following')}</div></div>
      </div>
      ${isMe ? `
        <div class="flex gap-2">
          <button onclick="state.activeModal='edit_profile';render()" class="btn-ghost flex-1 py-2 text-xs">${tr('editProfile')}</button>
          <button onclick="state.tab='verification';render()" class="btn flex-1 py-2 text-xs">Verification</button>
        </div>` : `
        <div class="flex gap-2">
          <button onclick="toggleFollow('${u.id}')" class="${isFollowing ? 'btn-ghost' : 'btn'} flex-1 py-2 text-xs">${isFollowing ? tr('following') : tr('follow')}</button>
          <button onclick="openConversation('${u.id}')" class="btn-ghost flex-1 py-2 text-xs">Message</button>
        </div>`}
    </div>
    <div class="space-y-3">
      <div class="text-xs uppercase font-semibold muted">Mood History (${userMoods.length})</div>
      ${userMoods.slice(0, 5).map(m => `<div class="card p-3 flex items-center gap-3"><span class="text-2xl">${m.emoji}</span><div class="flex-1 text-xs">${esc(m.text)}</div><span class="text-[11px] muted">${timeAgo(tsToMs(m))}</span></div>`).join('')}
    </div>
    <div class="grid grid-cols-3 gap-1.5">
      ${userPosts.map(p => p.image ? `<img src="${esc(p.image)}" class="aspect-square object-cover rounded-xl">` : `<div class="aspect-square soft rounded-xl p-2 text-[11px] flex items-center justify-center text-center">${esc(p.caption)}</div>`).join('')}
    </div>
  </div>`;
}

function openUserProfile(uid) {
  if (uid === state.user.uid) { state.tab = 'profile'; state.viewUserId = null; }
  else { state.tab = 'user_profile'; state.viewUserId = uid; }
  render();
}

function renderVerificationView() {
  const remaining = Math.max(0, APP_CONFIG.FREE_BADGE_LIMIT - state.badgeCountUsed);
  const isVerified = !!state.profile.verified;
  return `<div class="space-y-5">
    <h2 class="text-xl font-bold">${tr('verificationTitle')}</h2>
    ${isVerified ? `<div class="card p-5 border-blue-500/50 bg-blue-950/20 font-bold text-blue-400">✔ ${tr('badgeActive')}</div>` : ''}
    <div class="card p-5 space-y-3">
      <div class="flex items-center justify-between"><h3 class="font-bold text-sm text-blue-400">${tr('freePromoTitle')}</h3><span class="soft px-2.5 py-1 rounded-full text-xs font-bold">${remaining} / ${APP_CONFIG.FREE_BADGE_LIMIT}</span></div>
      <p class="text-xs muted leading-relaxed">${tr('freePromoDesc')}</p>
      ${!isVerified && remaining > 0 ? `<button onclick="claimPromotionalBadge()" class="btn w-full py-3">${tr('claimFreeBadge')}</button>` : ''}
    </div>
    <div class="card p-5 space-y-3">
      <div class="flex items-center justify-between"><h3 class="font-bold text-sm">${tr('premiumTitle')}</h3><span class="text-sm font-extrabold text-purple-400">${tr('premiumPrice')}</span></div>
      <p class="text-xs muted leading-relaxed">${tr('premiumDesc')}</p>
      <input id="pay-ref" placeholder="Transaction / Receipt Reference" class="input text-xs">
      <button onclick="initiatePremiumSubscription()" class="btn w-full py-3">${tr('subscribeNow')}</button>
    </div>
  </div>`;
}

function renderNotifsView() {
  return `<div class="space-y-4">
    <h2 class="text-xl font-bold">${tr('notifs')}</h2>
    ${state.notifs.map(n => `<div class="card p-3.5 flex items-center gap-3">${avatarHTML(getUser(n.fromUid), 'w-10 h-10')}<div class="flex-1 text-xs"><span class="font-bold">@${esc(getUser(n.fromUid).username)}</span> ${esc(n.text)}</div><span class="text-[10px] muted">${timeAgo(tsToMs(n))}</span></div>`).join('') || `<div class="card p-10 text-center text-sm muted">No notifications yet.</div>`}
  </div>`;
}

function toggleSoundEffects() {
  soundEnabled = !soundEnabled;
  localStorage.setItem('mg_sound', soundEnabled ? 'on' : 'off');
  if (soundEnabled) playSound('notif');
  render();
}

function renderSettingsView() {
  return `<div class="space-y-5">
    <h2 class="text-xl font-bold">${tr('settings')}</h2>
    <div class="card p-4 space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold">${tr('soundEffects')}</span>
        <button onclick="toggleSoundEffects()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold ${soundEnabled ? 'btn' : 'btn-ghost'}">${soundEnabled ? 'ON' : 'OFF'}</button>
      </div>
      <div><div class="text-xs muted mb-2">${tr('language')}</div><div class="grid grid-cols-2 gap-2"><button onclick="setLang('en')" class="py-2 rounded-xl text-xs font-semibold ${lang==='en' ? 'btn' : 'btn-ghost'}">English</button><button onclick="setLang('ru')" class="py-2 rounded-xl text-xs font-semibold ${lang==='ru' ? 'btn' : 'btn-ghost'}">Русский</button></div></div>
      <div><div class="text-xs muted mb-2">${tr('appearance')}</div><div class="grid grid-cols-2 gap-2"><button onclick="setTheme('dark')" class="py-2 rounded-xl text-xs font-semibold ${theme==='dark' ? 'btn' : 'btn-ghost'}">${tr('dark')}</button><button onclick="setTheme('light')" class="py-2 rounded-xl text-xs font-semibold ${theme==='light' ? 'btn' : 'btn-ghost'}">${tr('light')}</button></div></div>
      <button onclick="state.tab='verification';render()" class="btn-ghost w-full py-2.5 text-xs flex items-center justify-between px-4"><span>${tr('verificationTitle')}</span><span>→</span></button>
    </div>
    <div class="card p-4 space-y-2 text-xs">
      <div class="font-bold text-sm">${tr('aboutApp')}</div>
      <p class="muted leading-relaxed">${tr('aboutDesc')}</p>
      <div class="pt-2 border-t line flex justify-between muted font-medium"><span>Moodgram v3.0</span><span>${tr('byline')}</span></div>
    </div>
    <button onclick="logoutUser()" class="btn-ghost w-full py-3 text-rose-400 font-semibold">${tr('logout')}</button>
  </div>`;
}

function renderModals() {
  const root = $('modalroot');
  if (!state.activeModal) { root.innerHTML = ''; return; }
  if (state.activeModal === 'mood') {
    root.innerHTML = `<div class="fixed inset-0 z-50 bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
      <div class="card w-full md:max-w-md rounded-b-none md:rounded-3xl p-5 space-y-4">
        <div class="flex justify-between items-center"><h3 class="font-bold text-base">${tr('shareMood')}</h3><button onclick="state.activeModal=null;render()" class="muted text-lg">✕</button></div>
        <div class="grid grid-cols-5 gap-2">${MOOD_LIST.map(m => `<button onclick="state.selectedMood='${m.emoji}';render()" class="mood-chip mx-auto ${state.selectedMood===m.emoji ? 'on' : ''}">${m.emoji}</button>`).join('')}</div>
        <textarea oninput="state.moodDraft=this.value" rows="3" maxlength="240" placeholder="${tr('moodExplainPh')}" class="input resize-none">${esc(state.moodDraft)}</textarea>
        <button onclick="saveMoodPost()" class="btn w-full py-3">${tr('postMood')}</button>
      </div>
    </div>`;
  } else if (state.activeModal === 'post') {
    root.innerHTML = `<div class="fixed inset-0 z-50 bg-black/70 flex items-end md:items-center justify-center p-0 md:p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
      <div class="card w-full md:max-w-md rounded-b-none md:rounded-3xl p-5 space-y-3.5">
        <div class="flex justify-between items-center"><h3 class="font-bold text-base">${tr('newPost')}</h3><button onclick="state.activeModal=null;render()" class="muted text-lg">✕</button></div>
        <textarea oninput="state.postCaption=this.value" rows="3" placeholder="${tr('writeCaption')}" class="input resize-none">${esc(state.postCaption)}</textarea>
        <input value="${esc(state.postLocation)}" oninput="state.postLocation=this.value" placeholder="${tr('locationPh')}" class="input text-xs">
        <input value="${esc(state.postImageUrl)}" oninput="state.postImageUrl=this.value" placeholder="${tr('imageUrlPh')}" class="input text-xs">
        <label class="btn-ghost w-full py-2.5 text-center flex items-center justify-center gap-2 cursor-pointer text-xs">${ICONS.camera()} Upload Photo<input type="file" accept="image/*" hidden onchange="handlePostFileSelect(this)"></label>
        ${state.postImageData ? `<img src="${state.postImageData}" class="h-32 w-full object-cover rounded-xl">` : ''}
        <button onclick="publishPost()" class="btn w-full py-3">${tr('publish')}</button>
      </div>
    </div>`;
  } else if (state.activeModal === 'edit_profile') {
    const p = state.profile;
    root.innerHTML = `<div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" onclick="if(event.target===this){state.activeModal=null;render()}">
      <form onsubmit="updateProfileDetails(event)" class="card w-full max-w-md p-5 space-y-3">
        <div class="flex justify-between items-center"><h3 class="font-bold">${tr('editProfile')}</h3><button type="button" onclick="state.activeModal=null;render()" class="muted">✕</button></div>
        <div class="grid grid-cols-2 gap-2"><input id="ep-fname" value="${esc(p.firstName || '')}" class="input" required><input id="ep-lname" value="${esc(p.lastName || '')}" class="input"></div>
        <textarea id="ep-bio" rows="2" placeholder="${tr('bio')}" class="input">${esc(p.bio || '')}</textarea>
        <input id="ep-web" value="${esc(p.website || '')}" placeholder="${tr('website')}" class="input">
        <label class="flex items-center gap-2 text-xs pt-1"><input id="ep-priv" type="checkbox" ${p.isPrivate ? 'checked' : ''}><span>${tr('privateAccount')}</span></label>
        <button type="submit" class="btn w-full py-3">Save Profile</button>
      </form>
    </div>`;
  }
}

function viewStory(storyId) {
  const s = state.stories.find(x => x.id === storyId);
  if (!s) return;
  const u = getUser(s.uid);
  $('modalroot').innerHTML = `<div class="fixed inset-0 z-50 bg-black/95 flex flex-col items-center justify-center p-4" onclick="state.activeModal=null;renderModals()">
    <div class="max-w-sm w-full space-y-3">
      <div class="flex items-center gap-2.5 text-white">${avatarHTML(u, 'w-9 h-9')}<span class="font-semibold text-sm">@${esc(u.username)}</span></div>
      <img src="${esc(s.image)}" class="w-full max-h-[75vh] object-contain rounded-2xl">
    </div>
  </div>`;
}

function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('mg_lang', newLang);
  if (db && state.user && state.profile) db.collection('users').doc(state.user.uid).update({ language: newLang }).catch(() => {});
  render();
}

function setTheme(newTheme) {
  theme = newTheme;
  localStorage.setItem('mg_theme', newTheme);
  document.documentElement.classList.toggle('light', newTheme === 'light');
  render();
}

function renderChrome() {
  const loggedIn = !!(state.user && state.profile);
  const navItems = [
    ['home', ICONS.home, tr('home')],
    ['mood', ICONS.mood, tr('moodTab')],
    ['explore', ICONS.explore, tr('explore')],
    ['chats', ICONS.chats, tr('chats')],
    ['notifs', ICONS.notifs, tr('notifs')],
    ['profile', ICONS.profile, tr('profile')],
    ['settings', ICONS.settings, tr('settings')]
  ];

  $('side').innerHTML = loggedIn ? `
    <div class="flex items-center gap-3 px-2 py-3">${logoSVG('w-10 h-10')}<div><div class="text-xl logo-text leading-none">Moodgram</div><div class="text-[10px] muted mt-0.5">${tr('byline')}</div></div></div>
    <div class="space-y-1 mt-4 flex-1">${navItems.map(([k, iconFn, label]) => {
      const act = state.tab === k || (k === 'mood' && state.tab === 'friends_mood');
      return `<button onclick="state.tab='${k}';state.chatWith=null;render()" class="w-full flex items-center gap-3.5 px-3.5 py-3 rounded-2xl text-sm transition ${act ? 'soft font-bold text-white border line' : 'muted hover:text-white'}">${iconFn(act)}<span>${label}</span></button>`;
    }).join('')}</div>
    <button onclick="openMoodComposer()" class="btn w-full py-3 mb-2">+ ${tr('shareMood')}</button>
    <div class="text-[10px] text-center muted py-1">${tr('byline')}</div>` : '';

  $('top').innerHTML = loggedIn ? `
    <div class="flex items-center gap-2.5">${logoSVG('w-8 h-8')}<span class="text-xl logo-text">Moodgram</span></div>
    <div class="flex items-center gap-4">
      <button onclick="state.tab='notifs';render()" class="icon-btn">${ICONS.notifs(state.tab==='notifs')}</button>
      <button onclick="state.tab='chats';state.chatWith=null;render()" class="icon-btn">${ICONS.chats(state.tab==='chats')}</button>
      <button onclick="state.tab='settings';render()" class="icon-btn">${ICONS.settings(state.tab==='settings')}</button>
    </div>` : '';

  $('nav').innerHTML = loggedIn && !state.chatWith ? `
    <button onclick="state.tab='home';render()" class="icon-btn flex-1 justify-center ${state.tab==='home'?'text-white':'muted'}">${ICONS.home(state.tab==='home')}</button>
    <button onclick="state.tab='explore';render()" class="icon-btn flex-1 justify-center ${state.tab==='explore'?'text-white':'muted'}">${ICONS.explore(state.tab==='explore')}</button>
    <button onclick="openMoodComposer()" class="icon-btn flex-1 justify-center">${ICONS.plusBox()}</button>
    <button onclick="state.tab='mood';render()" class="icon-btn flex-1 justify-center ${state.tab==='mood'||state.tab==='friends_mood'?'text-white':'muted'}">${ICONS.mood(state.tab==='mood'||state.tab==='friends_mood')}</button>
    <button onclick="state.tab='profile';render()" class="icon-btn flex-1 justify-center ${state.tab==='profile'?'text-white':'muted'}">${avatarHTML(state.profile, 'w-7 h-7')}</button>` : '';

  $('side').classList.toggle('md:flex', loggedIn);
  $('top').classList.toggle('hidden', !loggedIn);
  $('nav').classList.toggle('hidden', !loggedIn || !!state.chatWith);
}

function renderMain() {
  const loggedIn = !!(state.user && state.profile);
  if (!loggedIn) {
    $('main').className = 'px-4 max-w-md mx-auto min-h-screen flex flex-col justify-between';
    $('main').innerHTML = `<div class="flex-1 flex flex-col justify-center">${renderAuthScreen()}</div><footer class="text-center py-5"><div class="text-[11px] uppercase tracking-widest muted font-semibold">${tr('byline')}</div></footer>`;
    return;
  }
  $('main').className = 'px-4 py-4 pb-28 md:pb-10 md:ml-64 max-w-2xl mx-auto min-h-screen';
  const routes = {
    home: () => renderHomeView(),
    mood: () => renderMoodTimelineView(false),
    friends_mood: () => renderMoodTimelineView(true),
    explore: () => renderExploreView(),
    chats: () => renderChatsView(),
    notifs: () => renderNotifsView(),
    profile: () => renderProfileView(null),
    user_profile: () => renderProfileView(state.viewUserId),
    verification: () => renderVerificationView(),
    settings: () => renderSettingsView()
  };
  $('main').innerHTML = (routes[state.tab] || routes.home)();
}

function render() {
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle('light', theme === 'light');
  renderChrome();
  renderMain();
  renderModals();
}

render();
</script>
</body>
</html>
